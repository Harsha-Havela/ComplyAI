{% extends "base.html" %}
{% block title %}404 Not Found — ComplyAI{% endblock %}
{% block page_title %}Error{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
    <div style="text-align:center;max-width:420px;">
        <div style="font-size:80px;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:16px;">404</div>
        <h3 style="font-size:20px;font-weight:700;margin-bottom:8px;">Page not found</h3>
        <p style="color:#64748b;font-size:14px;margin-bottom:28px;">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary"><i class="bi bi-house me-2"></i>Back to Dashboard</a>
    </div>
</div>
{% endblock %}
